name: Jury shell tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Exercise actual review shell without network or credentials
        run: python3 -m unittest discover -s tests -v
